[package]
name = "martian-robots"
version = "0.1.0"
description = "An implementation of the Martian Robots CLI contract"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/erinversfeldcodes/martian-robots"

# Nothing at runtime. The contract fixes a text interface on stdin and stdout,
# and the standard library covers every part of it.
[dependencies]

# The contract, at a pinned version, used at build time only. This crate does
# not restate the limits or the vocabularies: it reads them out of the release
# that the conformance suite will grade it against, so the two cannot disagree
# about what they are. Nothing from here is linked into the binary.
[build-dependencies]
martian-robots-verify = { git = "https://github.com/erinversfeldcodes/martian-robots-tests", tag = "v2.3.0" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The library exists so the binary and the tests can exercise the same code,
# and nothing outside this repository depends on it. These three lints describe
# obligations to callers who do not exist; satisfying them would add attributes
# and doc sections that state nothing true.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
