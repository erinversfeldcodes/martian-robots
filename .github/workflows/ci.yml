name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The suite release this repository is built and graded against. Cargo.toml
  # pins the same tag as a build dependency and the README installs it; a test
  # fails if the three ever disagree.
  SUITE_TAG: v2.3.0

  # The implementation conforms, so the whole suite is the gate rather than a
  # list of groups that have been claimed. This line was how incompleteness was
  # expressed while the port was in progress; there is nothing left to exclude.
  ENFORCED: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Reads rust-toolchain.toml, so CI and a developer's machine install the
      # same compiler from the same file.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatted
        run: cargo fmt --all --check

      - name: Linted, warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Tested
        run: cargo test --quiet

      - name: Built
        run: cargo build --release --locked

      # The suite carries the contract, so this installs the definition of
      # correct and the thing that checks it together, at one pinned version.
      - name: Install the conformance suite
        run: |
          cargo install --git https://github.com/erinversfeldcodes/martian-robots-tests \
            --tag "$SUITE_TAG" --locked --bin martian-robots-verify
          martian-robots-verify --version

      # The catalogue and all four generators, at the suite's default budgets
      # and its fixed default seed, so two runs of the same code grade the same
      # corpus. A failure here is a conformance failure, not a flake.
      - name: Graded against the whole suite
        run: |
          if [ "$ENFORCED" = "all" ]; then
            martian-robots-verify --bin ./target/release/martian-robots
            exit 0
          fi
          if [ -z "$ENFORCED" ]; then
            echo "Nothing is enforced yet."
            martian-robots-verify --bin ./target/release/martian-robots || true
            exit 0
          fi
          martian-robots-verify --bin ./target/release/martian-robots || true
          for group in $ENFORCED; do
            echo "== $group"
            martian-robots-verify --bin ./target/release/martian-robots --case "$group"
          done

      # A wider corpus than the gate uses, so a defect the fixed seed happens
      # not to reach still surfaces. It prints the seed it chose, which is the
      # seed to pass back to --seed when it finds something.
      - name: Explored on a corpus nobody pinned
        run: martian-robots-verify --bin ./target/release/martian-robots --quiet --seed random
